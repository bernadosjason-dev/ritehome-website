name = "ritehome-hannah"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Cloudflare Workers AI binding — free fallback backend, used only if
# neither GEMINI_API_KEY nor ANTHROPIC_API_KEY is set. No setup needed.
[ai]
binding = "AI"

# ---- Secrets (set these, never edited into this file) ----
# See README.md for where each of these comes from.
#
#   wrangler secret put GEMINI_API_KEY        # primary AI backend
#   wrangler secret put GEMINI_MODEL          # optional, defaults to gemini-3.1-pro-preview
#
#   wrangler secret put ANTHROPIC_API_KEY     # optional alternative to Gemini
#   wrangler secret put ANTHROPIC_MODEL       # optional, defaults to claude-haiku-4-5-20251001
#
#   wrangler secret put TELEGRAM_BOT_TOKEN    # for "notify a real person" alerts
#   wrangler secret put TELEGRAM_CHAT_ID
#
#   wrangler secret put APPS_SCRIPT_URL       # optional: log Hannah's captured
#                                              # leads to the same Sheet as the
#                                              # inquiry form (the same /exec URL
#                                              # as index.html's INQ_ENDPOINT)
